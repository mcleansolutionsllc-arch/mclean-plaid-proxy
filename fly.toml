# fly.toml — McLean Solutions Plaid proxy
# NOTE: app name may need a suffix if "mclean-plaid-proxy" is taken during `fly launch`/`fly deploy`.
app = "mclean-plaid-proxy"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    [services.ports.http_options]
      idle_timeout = 30

  [services.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "15s"
    timeout = "2s"
